name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: codegraph
  # Only Linux x86_64 static musl is built — runs on any glibc version.
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install musl cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV

      - name: Build static musl binary
        env:
          # sqlite-vec 0.1.6 uses BSD-style u_int*_t types that musl does not
          # define; map them to the standard uint*_t so the C code compiles.
          CFLAGS: -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t
        run: cargo build --release --target ${{ env.TARGET }} --no-default-features

      - name: Verify statically linked
        run: |
          file target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}
          ldd target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }} 2>&1 || true

      - name: Package binary
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="${BINARY_NAME}-${TAG}-${{ env.TARGET }}.tar.gz"
          cd target/${{ env.TARGET }}/release
          tar czf "../../../${ARCHIVE}" "${BINARY_NAME}"
          cd ../../..
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          gh release create "$TAG" \
            --title "CodeGraph $TAG" \
            --generate-notes \
            2>/dev/null || true

          find artifacts -name "*.tar.gz" -type f -exec \
            gh release upload "$TAG" {} --clobber \;
